<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modal-popup</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="wrap">
        <h1>Featured View</h1>
        <button class="btn" id="open">Open Photo</button>
    </main>
    <dialog id="modal">
       <image class="pic" src="https://commons.wikimedia.org/wiki/Special:FilePath/View_from_Mt_Fyffe,_Kaikoura_Ranges,_New_Zealand.jpg?width=3840" alt="View from Mt Fyffe over the Kaikoura Ranges, New Zealand" loading="lazy">
       <h2>Kaikoura Ranges</h2>
       <p>View from Mt Fyffe, New Zealand. Photo from Wikimedia Commons.</p>
       <button id="close" class="btn">Close</button>
    </dialog>
</body>
</html>
